# Gitleaks configuration for security-mcp's own self-scan.
#
# Extends the full default gitleaks ruleset (useDefault = true) and adds a narrow
# allowlist for the tool's own remediation-template registries. Those files pair a
# deliberately-insecure "before" example with the secure fix, so they necessarily
# contain placeholder credential strings (e.g. sk_live_XXXXplaceholderXXXX) that are
# teaching examples, never real secrets — the same false-positive class already
# excluded from the policy gate for fixtures/ and defaults/. This config applies only
# to this repo's own scans; .gitleaks.toml is not shipped in the npm package.
title = "security-mcp gitleaks config"

[extend]
useDefault = true

# The singular [allowlist] table, not [[allowlists]]: gitleaks/gitleaks-action is
# pinned to gitleaks 8.24.3, whose global (non-per-rule) config struct only has an
# `Allowlist` field (singular) — `[[allowlists]]` (plural, array-of-tables) isn't a
# recognized global key until 8.25.0 ("define multiple global allowlists" #1777),
# so any [[allowlists]] block here is silently dropped by Viper on that version and
# never suppresses anything. All path exclusions below are teaching/test examples,
# never real credentials:
#   - remediation-map.ts / remediation-parts/*.ts: fix-template registries pairing
#     a deliberately-insecure "before" example with the secure fix.
#   - .mcp/baselines/*.json: gate self-scan baselines embedding evidence snippets
#     from the tool's own insecure fixtures.
#   - tests/corpus/*.ts / verify-claims.mjs: rule-corpus TP fixtures and the
#     claims-verifier probe, which embed synthetic secrets to test detection rules.
[allowlist]
paths = [
  '''src/gate/remediation-map\.ts''',
  '''src/gate/remediation-parts/.*\.ts''',
  '''\.mcp/baselines/.*\.json''',
  '''src/tests/corpus/.*\.ts''',
  '''scripts/verify-claims\.mjs''',
]
