name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # environment: npm-publish gates the NPM_TOKEN release behind a required-reviewer
    # approval. Create this environment in GitHub → Settings → Environments with at
    # least one required reviewer before enabling it. Until then this serves as the
    # intent declaration; the concurrency guard above prevents duplicate publish runs.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # actions/checkout@v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # Needed before Test: the sbom check (and its rule-corpus SBOM_MISSING/
      # SBOM_STALE cases) fail-opens to a silent skip when syft isn't on PATH, so
      # without this the SBOM control is never actually exercised in CI.
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610  # anchore/sbom-action@v0.24.0

      - name: Enforce odometer version rule
        # Each of minor/patch must be a single digit 0-9 (carry at 10:
        # 1.0.9 -> 1.1.0). Also asserts the release tag matches package.json.
        env:
          TAG_REF: ${{ github.ref }}
        run: npm run version:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Run security gate (self-check — folder_by_folder on src/ skills/ defaults/)
        # FIX for TM-005: HEAD..HEAD always produces an empty diff → zero findings → gate
        # trivially passes on every publish. Use folder_by_folder mode so the gate scans
        # the actual source tree regardless of what changed since the last commit.
        env:
          SECURITY_GATE_MODE: "folder_by_folder"
          SECURITY_GATE_TARGETS: "src,skills,defaults"
          SECURITY_GATE_POLICY: "defaults/security-policy.json"
          SECURITY_GATE_EVIDENCE_MAP: "defaults/evidence-map.json"
          SECURITY_GATE_CONTROL_CATALOG: "defaults/control-catalog.json"
          # fixtures/ is deliberately-insecure test input (never shipped in the npm
          # package) that several always-on checks scan regardless of SECURITY_GATE_TARGETS;
          # skills/ and defaults/ stay in scope on purpose since both ARE shipped
          # (package.json "files") and this is the one gate that actually scans them.
          # remediation-parts/ is the fix-template registry's own before/after examples,
          # same false-positive class as fixtures/.
          SECURITY_GATE_IGNORE: "fixtures,**/remediation-parts/**"
          # Do NOT set SECURITY_GATE_EXCEPTIONS to the CI file: passing it via the env
          # override marks it isOverride, and unsigned override files are barred from
          # suppressing HIGH/CRITICAL. Leaving it unset lets the gate auto-load
          # .github/security-exceptions-ci.json.
          #
          # Auto-loading is no longer sufficient on its own. Being named
          # .github/security-exceptions-ci.json used to grant that file permission to suppress
          # HIGH/CRITICAL, but it lives inside the repo under scan, so any pull request could
          # add one and suppress every blocking finding.
          # Trust comes from a valid HMAC signature and nothing else (SECURITY_POLICY_HMAC_KEY
          # below). A fork PR never sees the secret, so it cannot produce a valid signature.
          # Sign with `security-mcp sign-exceptions` and commit the result.
          # Without the secret the file is unsigned, and an unsigned file may only suppress
          # LOW/MEDIUM noise. HIGH and CRITICAL stay active and the gate blocks on them. That
          # is intended: threats are fixed or explicitly signed for, never suppressed by
          # configuration.
          SECURITY_POLICY_HMAC_KEY: ${{ secrets.SECURITY_POLICY_HMAC_KEY }}
          SECURITY_GATE_SCANNERS: ".github/security-tools-ci.json"
        run: node dist/ci/pr-gate.js

      - name: Verify npm token
        # NPM_TOKEN must be an npm Automation token (not a Classic/Legacy token).
        # Automation tokens bypass 2FA (EOTP) requirements in CI/CD pipelines.
        # Create one at: https://www.npmjs.com/settings/<username>/tokens
        # → Generate New Token → Automation
        # Then store it as the NPM_TOKEN secret in:
        #   GitHub → Settings → Environments → npm-publish → Environment secrets
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set. Add an npm Automation token as NPM_TOKEN in the npm-publish environment secrets."
            exit 1
          fi
          npm whoami

      # Build the exact tarball that will be published, so the attestation below and the
      # publish below cover the same bytes. `npm publish <tarball>` republishes this file
      # rather than re-packing, which is what makes the attestation meaningful.
      - name: Pack tarball
        id: pack
        run: echo "tarball=$(npm pack --silent)" >> "$GITHUB_OUTPUT"

      # Supply-chain attestation for a package published from a PRIVATE source repo.
      #
      # `npm publish --provenance` is not usable here: npm rejects it with
      # "Unsupported GitHub Actions source repository visibility: private" (HTTP 422), because
      # npm provenance requires a public source repo so anyone can verify the build against it.
      # The package is public; the repository is not.
      #
      # GitHub Artifact Attestations give the same underlying guarantee without that
      # constraint: a Sigstore-signed SLSA build provenance statement binding this exact
      # tarball digest to this workflow, this commit, and this runner, recorded in a
      # transparency log. It works for private repositories. Anyone with repo access verifies
      # with:
      #
      #   gh attestation verify security-mcp-<version>.tgz --repo AbrahamOO/security-mcp
      #
      # This is an alternative to npm provenance, not a removal of attestation. If the repo is
      # ever made public, add --provenance back to the publish step to also surface the
      # "Provenance" badge on npmjs.com; the two are complementary.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a  # actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}

      - name: Publish
        # Publishes the attested tarball itself. --access public is what makes the package
        # public even though the source repository is private.
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
